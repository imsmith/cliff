services:
  cliff-base:
    image: ghcr.io/imsmith/cliff-base:latest
    container_name: cliff-base
    volumes:
      - ~/github:/workspace
      - devuser-home:/home/devuser
    tty: true
    stdin_open: true

  cliff-dev:
    image: ghcr.io/imsmith/cliff-dev:latest
    container_name: cliff-dev
    volumes:
      - ~/github:/workspace
      - devuser-home:/home/devuser
    tty: true
    stdin_open: true

  cliff-obsv:
    image: ghcr.io/imsmith/cliff-obsv:latest
    container_name: cliff-obsv
    volumes:
      - ~/github:/workspace
      - devuser-home:/home/devuser
    tty: true
    stdin_open: true

  cliff-full:
    image: ghcr.io/imsmith/cliff-full:latest
    container_name: cliff-full
    volumes:
      - ~/github:/workspace
      - devuser-home:/home/devuser
    tty: true
    stdin_open: true

volumes:
  devuser-home:
